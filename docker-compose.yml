services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: api_compatibility
      PGPORT: 5433
    command: -p 5433
    ports:
      - "5433:5433"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d api_compatibility -p 5433"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: