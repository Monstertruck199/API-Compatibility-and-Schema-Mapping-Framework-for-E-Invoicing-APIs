<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Compatibility Framework</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/comparison.css">
  <link rel="stylesheet" href="styles/compatibility-result.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/matrix.css">
  <link rel="stylesheet" href="styles/schema-viewer.css">
  <link rel="stylesheet" href="styles/database.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    (function () {
      const saved = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
</head>
<body>
<div class="shell">
  <div class="main">
    <div class="topbar">
      <div class="page-title" id="ptitle">API Compatibility Framework</div>
      <div class="topbar-actions">
        <button class="nav-item theme" id="theme-toggle" onclick="toggleTheme()">
          <span id = "theme-label">Toggle Theme</span>
          <span id = "theme-icon">⏾</span>
        </button>
        <button class="nav-item active" data-panel="schema-viewer" onclick="show('schema-viewer')">Schema viewer</button>
        <button class="nav-item" data-panel="schema-comparison" onclick="show('schema-comparison')">Schema comparison</button>
        <button class="nav-item" data-panel="compat-result" onclick="show('compat-result')">Compatibility result</button>
        <button class="nav-item" data-panel="matrix" onclick="show('matrix')">Matrix</button>
        <button class="nav-item" data-panel="database" onclick="show('database')">Database</button>
      </div>
    </div>

    <div class="content">
      <div class="panel active" id="panel-schema-viewer">
        <div class="sv-grid">
          <div>
            <div class="card" style="margin-bottom:14px">
              <div class="card-lbl">Add schema</div>
              <div class="ig">
                <div class="ig-lbl">API endpoint URL</div>
                <input class="ifield" id="sv-url" placeholder="https://api.example.com/endpoint">
              </div>
              <div class="ig">
                <div class="ig-lbl">Response format</div>
                <div class="fmt-row">
                  <button class="fmt-btn on" id="fj" onclick="setFmt('json')">JSON</button>
                  <button class="fmt-btn" id="fx" onclick="setFmt('xml')">XML</button>
                </div>
              </div>
              <div class="ig">
                <div class="ig-lbl">API name (optional)</div>
                <input class="ifield" id="sv-name" placeholder="e.g. ESS Validator">
              </div>
              <button class="analyse-btn" onclick="svAnalyse()">Analyse schema</button>
            </div>
            <div class="card">
              <div class="card-lbl">Loaded schemas</div>
              <div class="sv-list" id="sv-list">
                <div class="empty-hint">No schemas loaded yet</div>
              </div>
            </div>
          </div>
          <div class="card" id="sv-viewer"></div>
        </div>
      </div>

      <div class="panel" id="panel-schema-comparison">
        <div id="comparison-root"></div>
      </div>

      <div class="panel" id="panel-compat-result">
        <div id="compat-root"></div>
      </div>

      <div class="panel" id="panel-matrix">
        <div id="matrix-root"></div>
      </div>

      <div class="panel" id="panel-database">
        <div id="db-root"></div>
      </div>
    </div>
  </div>
</div>

<script src="schema-viewer.js"></script>
<script src="schema-comparison.js"></script>
<script src="compatibility-result.js"></script>
<script src="matrix.js"></script>
<script src="database.js"></script>
<script src="app.js"></script>
</body>
</html>
